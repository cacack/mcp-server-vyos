name: Dependabot Auto-Merge

on: pull_request_target

# The logic lives in cacack/workflows so a fix lands once for every repo that
# calls it, instead of being copy-pasted and drifting (#62). Pinned by SHA, as
# every other action in this repo is, so a change there is opt-in here.
#
# The two secrets are mapped by name rather than passed with `secrets:
# inherit`, which would hand this workflow every secret the repo holds to
# satisfy a contract that declares exactly two. They belong to the shared
# Dependabot App, stored in this repo's `dependabot` environment (see
# cacack/workflows, "The Dependabot App"). Its Workflows: write lets auto-merge
# be enabled on the Dependabot PRs that edit .github/workflows/* — a permission
# GITHUB_TOKEN cannot be granted. An App token also makes the resulting merge
# commit trigger CI, which a GITHUB_TOKEN push does not.
#
# A called workflow's job cannot request more than the caller grants here, so
# this must cover what that job declares — pull-requests included, or the run
# fails at startup before any step executes.
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    uses: cacack/workflows/.github/workflows/dependabot-automerge.yml@8c32eefebab14d35b588034d5bca5178d781acf6 # v2.4.0
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
