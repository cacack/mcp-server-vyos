name: auto-rebase

on:
  push:
    branches: [main]

# Use the release-please PAT rather than the default GITHUB_TOKEN. Events
# generated by GITHUB_TOKEN do not trigger downstream workflows, so rebase
# pushes it makes would skip CI on the rebased PR — defeating the point.
# A PAT-minted push re-triggers CI.
permissions: {}

concurrency:
  group: auto-rebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/rebase@e4945786f7ca41fe6e101cead4395f5489593943 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          exclude: |
            dependabot/**
            release-please--**
