name: auto-rebase

on:
  push:
    branches: [main]

# Use a token minted from the release-please GitHub App rather than the
# default GITHUB_TOKEN. Events generated by GITHUB_TOKEN do not trigger
# downstream workflows, so rebase pushes it makes would skip CI on the rebased
# PR — defeating the point. An App-minted push re-triggers CI. Rebasing a PR
# that edits .github/workflows/ needs the App's Workflows write permission.
permissions: {}

concurrency:
  group: auto-rebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: peter-evans/rebase@e4945786f7ca41fe6e101cead4395f5489593943 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          exclude: |
            dependabot/**
            release-please--**
