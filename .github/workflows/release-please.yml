name: Release Please

on:
  push:
    branches:
      - main
  # Lets this workflow be exercised from a branch before merging a change to
  # it. release-please still targets the repository default branch, so a
  # dispatch behaves the same as a push to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # release-please bumps the version in pyproject.toml but not uv.lock, and
      # the lock records the root project's own version. That leaves the lock
      # stale against its own project, so `uv sync --locked` fails on the
      # release PR — and on main once it merges.
      #
      # Find the open release PR directly rather than using the action's `pr`
      # output: that output is set only when release-please *creates or updates*
      # a PR. A commit of a hidden changelog type (ci, chore, docs) leaves the
      # release PR's content unchanged — the action logs "PR #N remained the
      # same" and sets no output — while still rebuilding the release branch on
      # top of the new main. The lock needs syncing in that case too.
      #
      # `--repo` is required: this step runs before any checkout, so there is no
      # git remote for gh to infer the repository from.
      - id: release_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          branch=$(gh pr list --repo "${{ github.repository }}" --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$branch" ]; then
            echo "Open release PR on branch: $branch"
          else
            echo "No open release PR; nothing to sync."
          fi

      - if: ${{ steps.release_pr.outputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - if: ${{ steps.release_pr.outputs.branch }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Idempotent: when the lock is already in sync `git diff --quiet` succeeds
      # and nothing is pushed, so this is safe to run on every push to main.
      # release-please force-pushes the release branch on each run, dropping any
      # previous sync commit — this step re-creates it, so the branch self-heals.
      - if: ${{ steps.release_pr.outputs.branch }}
        name: Sync uv.lock with the bumped version
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync; nothing to push."
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with release version" -- uv.lock
          git push

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
